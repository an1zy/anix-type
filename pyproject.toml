[project]
name = "anix-ghost"
version = "0.1.0"
description = "Context-aware AI ghost autocompletion & command forge for your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

authors = [{ name = "an1zy" }]
keywords = ["ai", "terminal", "powershell", "autocomplete", "cli", "ghost-text", "groq", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/an1zy/anix-ghost"
Issues = "https://github.com/an1zy/anix-ghost/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
anix-ghost = "anix_ghost.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anix_ghost*"]

[tool.setuptools.package-data]
"anix_ghost.integrations" = ["*.ps1", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
