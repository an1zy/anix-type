[project]
name = "anix-type"
version = "0.1.0"
description = "Context-aware autocompletion and natural language command forge for your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

authors = [{ name = "an1zy" }]
keywords = ["terminal", "powershell", "autocomplete", "cli", "ai", "ollama", "groq", "llm", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/an1zy/anix-type"
Issues = "https://github.com/an1zy/anix-type/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anix-type = "anix_type.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anix_type*"]

[tool.setuptools.package-data]
"anix_type.integrations" = ["*.ps1", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
